# =========================================================================
# ShopSense Multi-Vendor Analytics Platform - Render Blueprint Specification
# Milestone 4 & 5: Cloud Deployment Architecture
# =========================================================================

services:
  # -------------------------------------------------------------
  # Admin & Vendor Analytics Backend
  # -------------------------------------------------------------
  - type: web
    name: shopsense-admin-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt psycopg2-binary"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: shopsense-db
          property: connectionString
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"

  # -------------------------------------------------------------
  # Customer Experience Backend
  # -------------------------------------------------------------
  - type: web
    name: shopsense-customer-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r customer-backend/requirements.txt psycopg2-binary"
    startCommand: "uvicorn customer-backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: shopsense-db
          property: connectionString

  # -------------------------------------------------------------
  # Admin & Vendor Dashboard (React SPA)
  # -------------------------------------------------------------
  - type: web
    name: shopsense-admin-portal
    env: static
    region: oregon
    plan: free
    buildCommand: "npm --prefix frontend install && npm --prefix frontend run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://shopsense-admin-backend.onrender.com

  # -------------------------------------------------------------
  # Customer Storefront (React SPA)
  # -------------------------------------------------------------
  - type: web
    name: shopsense-customer-storefront
    env: static
    region: oregon
    plan: free
    buildCommand: "npm --prefix customer-frontend install && npm --prefix customer-frontend run build"
    staticPublishPath: "./customer-frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://shopsense-customer-backend.onrender.com

# Managed PostgreSQL Database
databases:
  - name: shopsense-db
    databaseName: shopsensedb
    user: shopsense
    region: oregon
    plan: free
